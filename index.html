/* ---------- AUDIO ---------- */
let AC=null,master=null,drone=null;
function audio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=S.snd?.5:0;master.connect(AC.destination);startDrone();}catch(e){AC=null;}}
function startDrone(){const g=AC.createGain();g.gain.value=.05;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;g.connect(f);f.connect(master);
 [55,82.4,110.3].forEach((fr,i)=>{const o=AC.createOscillator();o.type=i?'sawtooth':'triangle';o.frequency.value=fr;const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.07+i*.05;lg.gain.value=1.6;l.connect(lg);lg.connect(o.detune);o.connect(g);o.start();l.start();});drone=g;}
function tone(f,d,type,vol,slide,delay){if(!AC||!S.snd)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}
function noise(d,vol,fq){if(!AC||!S.snd)return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||900;const g=AC.createGain();g.gain.value=vol||.3;s.connect(f);f.connect(g);g.connect(master);s.start();}
const SFX={
 bolt:()=>{tone(720,.18,'sawtooth',.08,240);noise(.08,.08,2400)},

 skill:()=>{tone(220,.5,'sawtooth',.12,880);noise(.3,.15,1800)},
 heal:()=>{[523,659,784].forEach((f,i)=>tone(f,.4,'sine',.1,0,i*.07))},

 ui:()=>tone(600,.06,'triangle',.06,500)
};

/* ---------- STORY ---------- */
const INTRO=[
 ['The Year the Sky Went Grey','In the time before counting, the god called <b>the Ember</b> burned above the steppe. Then, one autumn, it guttered — and fell.\n\nFor forty days it snowed ash. The ash was warm. Where it settled on the dead, <i>the dead sat up</i>.\n\nThe priests of Oss call this <b>Year Nothing</b>. The tribes call it <b>the Kindling</b>. Everyone agrees on one thing: something is walking toward the place where the god\'s heart struck the earth.'],
 ['Ysolde of the Horse-Folk','You are <b>Ysolde</b>, fifteen winters, last daughter of the Saar clan. Your mother traded your true name to a carrion-spirit for one more year of grass. You have only the name the ash gave you.\n\nWhen the ash touches your palms, it <b>burns without burning you.</b>\n\nThe clan elders call that a curse. Two strangers call it a road.'],
 ['The Oath at the Cairn','<b>Tarqun</b>, river-warden of Oss, swore on his own opened wrist to escort you to the Heart-Crater. In Oss an oath is law; a broken one is paid in the breaker\'s children.\n\n<b>Wenna Ninefingers</b>, ash-priest, cut off her tenth finger to buy a conversation with the dead. They told her your name before you were born.\n\n<i>Three bloods in one cup. Drink, and walk.</i>']
];
const STAGES=[
 {n:'Steppe of Bones',t:'Where your clan\'s horses lie in rings, ash on their eyes.',col:['#2a1a10','#120806'],gr:'#3a2414',x:.18,y:.78,
  card:['Steppe of Bones','The grass is grey to the horizon. The horses of the Saar lie in rings, as though they died walking in circles.\n\nThen the rings <i>stand up</i>.\n\n<b>Wenna:</b> "Ash-walkers. The god\'s dust is in them, child. It wants to go home — through you, if it can."'],
  waves:[['walker',6],['walker',8,'hound',3],['hound',6,'walker',6]]},
 {n:'Oss Ford',t:'The river-kingdom\'s drowned toll-gate.',col:['#0e1a20','#06080c'],gr:'#14262c',x:.42,y:.52,
  card:['Oss Ford','The ford is choked with bodies wearing Oss river-blue. Tarqun counts them aloud by name. He knew eleven.\n\n<b>Tarqun:</b> "They swore to hold this ford until death. Death came. The oath did not end."\n\n<i>An oath that outlives its swearer becomes hunger.</i>'],
  waves:[['drowned',7,'walker',4],['oathbound',3,'drowned',6],['oathbound',5,'hound',6]]},
 {n:'Barrow of Names',t:'Where the steppe buries what it fears to say.',col:['#1a1020','#08060c'],gr:'#22182a',x:.66,y:.34,
  card:['Barrow of Names','Under the hill, every stone is carved with a name — and every name has been scratched out.\n\n<b>Wenna:</b> "Here the tribes bury those whose names were sold. Your mother\'s debt sleeps here, Ysolde."\n\nIn the dark, something whispers the name you never got to keep. <i>It sounds hungry. It sounds like her.</i>'],
  waves:[['wisp',8,'walker',6],['nameless',3,'wisp',8],['nameless',5,'oathbound',4,'hound',6]]},
 {n:'The Heart-Crater',t:'Where the god struck the earth. Something wears its ash.',col:['#2a0806','#0a0202'],gr:'#3a100a',x:.86,y:.14,boss:1,
  card:['The Heart-Crater','The crater glows like a forge left open. At its center kneels <b>the Hollow King</b>: a corpse the size of a barrow, stitched from a hundred dead, wearing the god\'s ash like a mantle.\n\nIt turns. Its voice is every voice in the barrow.\n\n<i>"Little ember. I have been warming the throne for you."</i>'],
  waves:[['boss',1]]},
 {n:'The Salt Marches',t:'Oss country. White ground, red water.',col:['#2a2a2c','#0c0c10'],gr:'#3a3634',x:.16,y:.8,
  card:['The Salt Marches','The steppe turns white. Salt. The river-kingdom of Oss salted its own fields so the ash could not take root.\n\n<b>Tarqun:</b> "My people have a saint now. A woman who does not die. They say she drinks the dead to keep the ash out of them."\n\n<i>Then the salt stands up, wearing the skins of men.</i>'],
  waves:[['skin',6,'walker',6],['skin',8,'hound',6],['salt',4,'skin',6]]},
 {n:'Korr\'s Snare',t:'A hunter\'s camp hung with skins that were not animals.',col:['#20160e','#080604'],gr:'#2e2014',x:.4,y:.56,
  card:['Korr\'s Snare','A camp of bone frames and stretched hides. A huge man is tied to a stake, his own skinning knives in a ring around him.\n\n<b>Korr:</b> "The Saint\'s pilgrims left me for the skin-walkers. Cut me loose, coal-girl, and my axes are yours."\n\n<b>Korr the Flayer joins.</b> His thrown axes fly in pairs. His Howl throws back everything near him and makes it bleed. Swap to him with the swap button.\n\n<i>He wears his dead wife\'s face-paint. He does not say how she died.</i>'],
  waves:[['skin',8,'salt',4],['witch',4,'skin',8],['witch',5,'salt',5,'hound',6]]},
 {n:'The Pilgrim Road',t:'Ten thousand pilgrims walked here. Few walked back.',col:['#1c1418','#08050a'],gr:'#2a1e22',x:.64,y:.36,
  card:['The Pilgrim Road','The road to Oss is lined with pilgrims kneeling in the salt. None of them are breathing. All of them are smiling.\n\n<b>Wenna:</b> "She did not drink the dead, child. She drank the living, and called it a blessing."\n\nAt the end of the road waits the Saint\'s Warden: a knight in salt-crusted armor carrying a reliquary that weeps.'],
  waves:[['witch',6,'skin',8],['warden',1,'salt',6],['warden',2,'witch',6,'skin',6]]},
 {n:'The Salt Cathedral',t:'Where the Saint of Oss drinks her flock.',col:['#2a2420','#0c0806'],gr:'#3e3428',x:.86,y:.14,boss:1,bn:'The Saint of Oss',
  card:['The Salt Cathedral','A cathedral carved from one salt hill. Thousands kneel inside, white to the knees, white to the waist, white to the eyes.\n\nOn the altar sits <b>the Saint of Oss</b>, beautiful and terribly thin. A hundred feeding tubes of red glass run from her to her congregation.\n\n<i>"Give me the coal, little ember, and no one on the steppe will ever die again. They will only kneel."</i>'],
  waves:[['saint',1]]}
];
const END=['The Coal','The Hollow King comes apart like a burned house in rain. In its chest, still beating, sits a coal the size of a child\'s fist: <b>the last of the Ember\'s heart.</b>\n\nTarqun\'s oath ends here. He does not lower his spear. Wenna weeps without sound.\n\n<b>Wenna:</b> "If no one carries it, it goes out. If it goes out, the dead never lie down again."\n\nYou take the coal. It is warm as a mother\'s hand.\n\n<i>You swallow it.</i>\n\nThe pain is a sun. When you open your eyes, your hair is white as ash and the steppe is kneeling.\n\nFar off, in a country that does not exist yet, iron hums. Wenna\'s dead whisper a prophecy she will not repeat aloud — about <b>nine bells</b>, and a city that will one day try to ring your fire back out of the earth.\n\n<b>"Grandmother," they whisper. "Grandmother Cinder."</b>\n\n— END OF CHAPTER I —'];
const LORE='<b>The Ninth Bell</b> (told on the steppe to frighten children)\n\nOne day men will forget the Ember and build eight great bells to drink the warmth from the ground. The eighth will ring, and the ninth will be cast — and on that day Grandmother Cinder will wake in the bell\'s throat and ask who stole her fire.\n\n<b>The Name-Eater</b>\nNever say your true name near a barrow. The nameless dead collect them, and a stolen name can be bargained back only in blood.\n\n<b>Oaths of Oss</b>\nThe river-folk swear on an opened wrist. An oath outlives the swearer. That is why Oss has so many drowned soldiers still standing guard.\n\n<b>Ash-Priests</b>\nThey cut away a finger for each conversation with the dead. Old priests have none left, and speak to the dead with their eyes.';

function newRun(){

/* ---------- FX ---------- */
function part(x,y,n,col,sp,life,sz){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(.2,1)*sp;P.length<600&&P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*rnd(.6,1.2),ml:life,c:col,s:sz||rnd(1.5,3.5)});}}
function ftxt(x,y,s,col,big){TXT.push({x:x+rnd(-8,8),y,s:String(s),c:col,l:big?1.2:.85,ml:big?1.2:.85,big});}
function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,1600);}
function nearest(x,y,max){let b=null,bd=max||9999;for(const e of ENS){const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;b=e;}}return b;}

function hitEnemy(e,base,kb,ax,ay){
 if(e.dead)return;
 let crit=Math.random()<.12,d=base*dmgMul()*(crit?2:1);
 if(G.swapBonus>0){d*=1.5+.25*S.up.oath;crit=true;G.swapBonus=0;ftxt(G.x,G.y-40,'SWAP STRIKE','#ffe08a',true);}
 if(e.armor)d*=1-e.armor;
 d=Math.round(d);e.hp-=d;e.hit=.12;
 const a=Math.atan2(e.y-ay,e.x-ax);if(!e.boss){e.kx+=Math.cos(a)*kb;e.ky+=Math.sin(a)*kb;}
 ftxt(e.x,e.y-e.r,crit?d+'!':d,crit?'#ffe08a':'#fff',crit);
 part(e.x,e.y,crit?14:6,crit?'#ffe08a':'#ff9a5a',crit?200:120,.5);
 crit?(SFX.crit(),shake=Math.max(shake,6),buzz(18)):SFX.hit();
 if(e.hp<=0)kill(e);
}

 e.dead=true;SFX.die();part(e.x,e.y,e.boss?160:22,'#c8b8a8',e.boss?400:160,1.1,3);part(e.x,e.y,e.boss?80:10,'#ff7a2f',e.boss?300:120,.9);
 shake=Math.max(shake,e.boss?30:4);G.kills++;G.score+=Math.round(e.ash*10*(1+G.ng*.5));
 const n=Math.ceil(e.ash*(1+.2*S.up.ash)*(1+G.ng*.3));
 for(let i=0;i<Math.min(n,12);i++)ASHP.push({x:e.x,y:e.y,vx:rnd(-90,90),vy:rnd(-90,90),v:Math.ceil(n/Math.min(n,12)),t:0});
 if(e.boss){slowmo=1.4;flash=1;buzz([60,40,120]);}
}
function hurtHero(d,sx,sy){

 if(G.block>0){d*=.15;SFX.block();part(G.x,G.y,8,'#9ee0ff',150,.4);}

 d=Math.max(1,Math.round(d*(1+G.ng*.15)));h.hp-=d;G.inv=.45;flash=Math.max(flash,.35);shake=Math.max(shake,9);
 ftxt(G.x,G.y-24,'-'+d,'#ff4a5a',false);part(G.x,G.y,10,'#c2263a',140,.6);
 if(h.hp<=0){h.hp=0;h.dead=true;toast(h.d.n+' falls!');const nx=G.heroes.findIndex(q=>!q.dead);if(nx<0){gameOver(false);return;}G.act=nx;G.inv=1.5;G.swapCd=0;SFX.swap();}
}

 let ax=G.fx,ay=G.fy;if(t){const l=Math.hypot(t.x-G.x,t.y-G.y)||1;ax=(t.x-G.x)/l;ay=(t.y-G.y)/l;G.fx=ax;G.fy=ay;}
 if(h.d.id==='ys'){PR.push({x:G.x,y:G.y,vx:ax*560,vy:ay*560,d:15,r:7,l:.9,c:'#ff8a3a',own:1,tr:1});SFX.bolt();}
 else if(h.d.id==='we'){PR.push({x:G.x,y:G.y,vx:ax*380,vy:ay*380,d:10,r:9,l:1.1,c:'#c8b0ff',own:1,tr:1,pierce:2});SFX.bolt();}
 else if(h.d.id==='ko'){[-.18,.18].forEach(o=>{const a=Math.atan2(ay,ax)+o;PR.push({x:G.x,y:G.y,vx:Math.cos(a)*460,vy:Math.sin(a)*460,d:13,r:8,l:.75,c:'#e0a070',own:1,tr:1,pierce:1})});SFX.spear();}
 else{ // spear thrust cone
  SFX.spear();const a0=Math.atan2(ay,ax);FX.push({k:'arc',x:G.x,y:G.y,a:a0,l:.18,ml:.18,c:'#9ee0ff',r:78});
  for(const e of ENS){const dx=e.x-G.x,dy=e.y-G.y,dd=Math.hypot(dx,dy);if(dd<78+e.r){let da=Math.abs(((Math.atan2(dy,dx)-a0+9.42)%6.283)-3.14);if(da<.9)hitEnemy(e,24,22,G.x,G.y);}}

 else if(h.d.id==='ko'){FX.push({k:'ring',x:G.x,y:G.y,l:.5,ml:.5,c:'#e0a070',r:220});shake=Math.max(shake,14);part(G.x,G.y,50,'#c03a20',300,.7);
  for(const e of ENS)if(Math.hypot(e.x-G.x,e.y-G.y)<220+e.r)hitEnemy(e,30,160,G.x,G.y);}

  for(const q of G.heroes)if(!q.dead){const a=Math.round(q.max*.2);q.hp=Math.min(q.max,q.hp+a);}ftxt(G.x,G.y-40,'+20% party','#9effb0',true);}

 for(const e of ENS)if(Math.hypot(e.x-G.x,e.y-G.y)<80+e.r){e.kx+=(e.x-G.x)*.8;e.ky+=(e.y-G.y)*.8;}

/* ---------- WAVES ---------- */
function diff(){return 1+G.stage*.22+G.wave*.08+G.ng*.6;}
function spawn(type,n){
 const b=EN[type],m=diff();
 for(let i=0;i<n;i++){
  let x,y;do{const s=Math.floor(Math.random()*4);x=s<2?rnd(40,AW-40):(s===2?30:AW-30);y=s>=2?rnd(40,AH-40):(s===0?30:AH-30);}while(Math.hypot(x-G.x,y-G.y)<300);
  if(b.boss){x=AW/2;y=160;}
  const hp=Math.round(b.hp*m*(b.boss?1:1));
  ENS.push({type,x,y,kx:0,ky:0,hp,max:hp,spd:b.spd*(1+G.ng*.1)*rnd(.9,1.1),dmg:b.dmg*(1+G.stage*.1),r:b.r,col:b.col,ash:b.ash,armor:b.armor||0,ranged:b.ranged,blink:b.blink,boss:b.boss,
   cd:rnd(1,2.5),hit:0,ph:Math.random()*6,dead:false,st:0,tel:0});
  if(b.boss)G.boss=ENS[ENS.length-1];
 }
}
function startWave(){
 const w=STAGES[G.stage].waves[G.wave];
 for(let i=0;i<w.length;i+=2)spawn(w[i],w[i+1]);
 $('info').textContent=STAGES[G.stage].n+' — '+(STAGES[G.stage].boss?(STAGES[G.stage].bn||'The Hollow King'):'Wave '+(G.wave+1)+'/'+STAGES[G.stage].waves.length);
 if(STAGES[G.stage].boss){SFX.boss();shake=20;toast((STAGES[G.stage].bn||'The Hollow King').toUpperCase());}else toast('Wave '+(G.wave+1));
}
function enterStage(){
 ENS.length=0;PR.length=0;ASHP.length=0;FX.length=0;G.x=AW/2;G.y=AH*.7;G.wave=0;G.boss=null;G.spirit=null;
 for(const q of G.heroes)if(!q.dead)q.hp=Math.min(q.max,q.hp+Math.round(q.max*.35));
 // revive fallen at 30% between stages
 for(const q of G.heroes)if(q.dead){q.dead=false;q.hp=Math.round(q.max*.3);}
 if(G.heroes[G.act].dead)G.act=G.heroes.findIndex(q=>!q.dead);
 show(null);$('hud').classList.add('on');state='play';G.between=1.2;

/* ---------- BOSS AI ---------- */
function bossAI(e,dt){
 const ph=e.hp<e.max*.5?2:1;
 if(ph===2&&!e.p2){e.p2=1;toast('The ash-mantle burns!');SFX.boss();shake=25;spawn('nameless',3);e.spd*=1.4;}
 e.cd-=dt;
 if(e.tel>0){e.tel-=dt;if(e.tel<=0){ // slam lands
   FX.push({k:'ring',x:e.tx,y:e.ty,l:.5,ml:.5,c:'#ff3a1a',r:150});shake=Math.max(shake,22);part(e.tx,e.ty,50,'#ff5a2a',300,.8);noise(.5,.4,150);buzz(60);
   if(Math.hypot(G.x-e.tx,G.y-e.ty)<150)hurtHero(e.dmg*1.6,e.tx,e.ty);}
  return true;}
 if(e.cd<=0){
  const r=Math.random();
  if(r<.4){e.tel=1.1;e.tx=G.x;e.ty=G.y;FX.push({k:'tel',x:G.x,y:G.y,l:1.1,ml:1.1,r:150});e.cd=ph===2?1.8:2.6;}
  else if(r<.75){const n=ph===2?18:12;for(let i=0;i<n;i++){const a=i/n*6.283+e.ph;PR.push({x:e.x,y:e.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,d:e.dmg*.6,r:9,l:4,c:'#ff5a2a',own:0});}tone(90,.4,'sawtooth',.15,40);e.cd=ph===2?1.6:2.4;}
  else{spawn(Math.random()<.5?'walker':'hound',ph===2?5:3);toast('The dead answer it');e.cd=2.5;}
 }
 return false;
}

/* ---------- UPDATE ---------- */
function update(dt){
 G.t+=dt;const h=hero();
 if(G.between>0){G.between-=dt;if(G.between<=0)startWave();}
 // move
 let mx=joy.dx,my=joy.dy;if(keys.a||keys.arrowleft)mx=-1;if(keys.d||keys.arrowright)mx=1;if(keys.w||keys.arrowup)my=-1;if(keys.s||keys.arrowdown)my=1;
 const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
 const sp=h.d.spd*(1+.07*S.up.swift)*(G.block>0?.5:1);
 G.x=clamp(G.x+mx*sp*dt,20,AW-20);G.y=clamp(G.y+my*sp*dt,20,AH-20);
 if(ml>.15){G.fx=mx/Math.max(ml,1e-3);G.fy=my/Math.max(ml,1e-3);if(Math.random()<.5)part(G.x,G.y+10,1,h.d.col,30,.4,2);}
 for(const q of G.heroes){q.atk=Math.max(0,q.atk-dt);q.sk=Math.max(0,q.sk-dt);if(q!==h&&!q.dead)q.hp=Math.min(q.max,q.hp+q.max*.012*dt);}
 G.swapCd=Math.max(0,G.swapCd-dt);G.swapBonus=Math.max(0,G.swapBonus-dt);G.inv=Math.max(0,G.inv-dt);G.block=Math.max(0,G.block-dt);
 if(atkHeld&&G.between<=0)attack();
 // spirit
 if(G.spirit){const s=G.spirit;s.t-=dt;s.x+=(G.x-40-s.x)*dt*3;s.y+=(G.y-30-s.y)*dt*3;s.atk-=dt;
  if(s.atk<=0){const t=nearest(s.x,s.y,360);if(t){const l=Math.hypot(t.x-s.x,t.y-s.y);PR.push({x:s.x,y:s.y,vx:(t.x-s.x)/l*420,vy:(t.y-s.y)/l*420,d:12,r:6,l:1,c:'#e0d0ff',own:1,tr:1});s.atk=.45;}}
  if(Math.random()<.6)part(s.x,s.y,1,'#e0d0ff',20,.6,2.5);if(s.t<=0)G.spirit=null;}
 // enemies
 for(const e of ENS){
  e.hit=Math.max(0,e.hit-dt);e.ph+=dt;
  if(e.boss&&bossAI(e,dt))continue;
  const dx=G.x-e.x,dy=G.y-e.y,d=Math.hypot(dx,dy)||1;
  let want=1;
  if(e.ranged){want=d>260?1:d<180?-1:0;e.cd-=dt;if(e.cd<=0&&d<480){PR.push({x:e.x,y:e.y,vx:dx/d*230,vy:dy/d*230,d:e.dmg,r:7,l:3,c:'#b08aff',own:0});e.cd=rnd(1.6,2.4);tone(500,.15,'sine',.05,250);}}
  if(e.blink){e.cd-=dt;if(e.cd<=0&&d>140){part(e.x,e.y,14,'#6a4a7a',120,.5);const a=Math.random()*6.283;e.x=clamp(G.x+Math.cos(a)*110,20,AW-20);e.y=clamp(G.y+Math.sin(a)*110,20,AH-20);part(e.x,e.y,14,'#6a4a7a',120,.5);e.cd=rnd(3,4.5);tone(200,.3,'sine',.08,900);}}
  e.x+=(dx/d*e.spd*want+e.kx)*dt;e.y+=(dy/d*e.spd*want+e.ky)*dt;e.kx*=.86;e.ky*=.86;
  e.x=clamp(e.x,10,AW-10);e.y=clamp(e.y,10,AH-10);
  if(d<e.r+16){e.st-=dt;if(e.st<=0){hurtHero(e.dmg,e.x,e.y);e.st=.9;}}
 }
 // separation
 for(let i=0;i<ENS.length;i++)for(let j=i+1;j<ENS.length;j++){const a=ENS[i],b=ENS[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,m=a.r+b.r;if(d<m){const p=(m-d)/2/d;if(!a.boss){a.x-=dx*p;a.y-=dy*p;}if(!b.boss){b.x+=dx*p;b.y+=dy*p;}}}
 // projectiles
 for(const p of PR){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.tr&&Math.random()<.8)part(p.x,p.y,1,p.c,25,.35,2.5);
  if(p.own){for(const e of ENS){if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r&&(!p.hitset||!p.hitset.includes(e))){hitEnemy(e,p.d,14,p.x-p.vx*.01,p.y-p.vy*.01);if(p.pierce){p.pierce--;(p.hitset=p.hitset||[]).push(e);}else{p.l=0;}break;}}}
  else if(Math.hypot(G.x-p.x,G.y-p.y)<14+p.r){hurtHero(p.d,p.x,p.y);p.l=0;}
  if(p.x<0||p.y<0||p.x>AW||p.y>AH)p.l=0;}
 filt(PR,p=>p.l>0);filt(ENS,e=>!e.dead);
 // ash pickups
 for(const a of ASHP){a.t+=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vx*=.9;a.vy*=.9;if(a.t>.4){const dx=G.x-a.x,dy=G.y-a.y,d=Math.hypot(dx,dy)||1;a.x+=dx/d*520*dt;a.y+=dy/d*520*dt;if(d<20){a.got=1;G.ashRun+=a.v;SFX.ash();}}}
 filt(ASHP,a=>!a.got);
 // wave clear
 if(state==='play'&&G.between<=0&&ENS.length===0){
  G.wave++;
  if(G.wave>=STAGES[G.stage].waves.length){stageClear();}
  else{G.between=1.6;toast('The dead lie still… for now');}
 }
}
function filt(a,f){let j=0;for(let i=0;i<a.length;i++)if(f(a[i]))a[j++]=a[i];a.length=j;}

/* ---------- FLOW ---------- */

function drawMap(){const c=$('mapc'),r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;const m=c.getContext('2d');m.scale(d,d);const w=r.width,h=r.height;
 const g=m.createRadialGradient(w*.85,h*.15,10,w/2,h/2,w);g.addColorStop(0,'#5a1a0a');g.addColorStop(1,'#120806');m.fillStyle=g;m.fillRect(0,0,w,h);
 m.strokeStyle='#2a6a8a';m.lineWidth=6;m.beginPath();m.moveTo(0,h*.45);m.bezierCurveTo(w*.3,h*.6,w*.5,h*.4,w,h*.62);m.stroke();m.fillStyle='#4aa8c8';m.font='italic 12px Georgia';m.fillText('River Oss',w*.62,h*.6);
 for(let i=0;i<40;i++){m.fillStyle='rgba(200,180,160,'+(Math.random()*.15)+')';m.fillRect(Math.random()*w,Math.random()*h,2,2);}
 m.setLineDash([5,6]);m.strokeStyle='#e8c27a88';m.lineWidth=2;m.beginPath();STAGES.forEach((s,i)=>i?m.lineTo(s.x*w,s.y*h):m.moveTo(s.x*w,s.y*h));m.stroke();m.setLineDash([]);
 STAGES.forEach((s,i)=>{if((i>=4)!==(G.stage>=4))return;const x=s.x*w,y=s.y*h,cur=i===G.stage,done=i<G.stage;m.beginPath();m.arc(x,y,cur?13:9,0,7);m.fillStyle=done?'#6a5a4a':cur?'#ff7a2f':'#3a2420';m.shadowColor='#ff7a2f';m.shadowBlur=cur?20:0;m.fill();m.shadowBlur=0;m.strokeStyle='#e8c27a';m.stroke();
  m.fillStyle=cur?'#ffe08a':'#c8b8a8';m.font=(cur?'bold ':'')+'13px Georgia';m.textAlign=s.x>.7?'right':'left';m.fillText((done?'✓ ':'')+s.n,x+(s.x>.7?-16:16),y+4);});m.textAlign='left';}
function finishRun(win){const ashGain=G.ashRun;S.ash+=ashGain;const sc=G.score+G.kills*5;if(sc>S.best)S.best=sc;if(win){S.wins++;S.ng++;}save();return {ashGain,sc};}
function gameOver(){if(state==='over')return;state='over';shake=20;SFX.die();buzz([100,50,200]);
 setTimeout(()=>{const r=finishRun(false);$('oT').textContent='The Ash Takes You';
  $('oX').innerHTML='Your bodies cool on the steppe. By dawn, the ash has found them.\n\n<i>Three more walkers join the circle.</i>\n\nReached: <b>'+STAGES[Math.min(G.stage,STAGES.length-1)].n+'</b>\nKills: <b>'+G.kills+'</b>\nScore: <b>'+r.sc+'</b>  ·  Best: <b>'+S.best+'</b>\nAsh gathered: <span class="ash">+'+r.ashGain+'</span>\n\nSpend it at the Ash-Shrine. Death here is a lesson, not an ending.';show('over');},900);}
function victory(){state='over';const r=finishRun(true);
 setTimeout(()=>cards([END,['Chapter I Complete','<b>Score: '+r.sc+'</b>  ·  Best: '+S.best+'\nKills: '+G.kills+'\nAsh: <span class="ash">+'+r.ashGain+'</span>\n\n<b>The Toll rises.</b> Ember Toll '+S.ng+' unlocked: the dead hit harder and drop more ash.\n\n<i>Five hundred years from now, in a smog city called Corrow, men will cast eight bells to drink the warmth from the ground. They will forget your name.\n\nThe ninth bell will not.</i>\n\nChapter II: <b>The Saint of Oss</b> — coming soon.']],()=>{refreshMenu();show('menu');state='menu';}),1400);}
const CH2CARD=['Chapter II \u00b7 The Saint of Oss','Ysolde does not let the coal go out. It burns her hands, and she lets it.\n\nSouth, beyond the salt, the river-kingdom of Oss has a living saint. Tarqun\'s people kneel to her. The coal pulls toward her like a dog toward meat.\n\n<b>Tarqun:</b> "If she is what I think she is, I will have to kill my own queen."'];
function addKorr(){const u=S.up,mx=Math.round(KORR.hp*(1+.15*u.vit)*(1+.2*S.ng));G.heroes.push({d:KORR,hp:mx,max:mx,atk:0,sk:0,dead:false});toast('Korr joins the circle');}
function victory2(){state='over';const r=finishRun(true);
 setTimeout(()=>cards([['The Saint Drinks','The Saint of Oss comes apart into salt. Every feeding tube runs dry at once, and ten thousand kneeling pilgrims fall forward together, like wheat.\n\nTarqun kneels by the altar. She was his queen. He closes her eyes and does not weep.\n\nKorr cuts a strip of her robe and ties it to his axe. Wenna watches him for a long time.\n\nThe coal in Ysolde\'s hands beats twice, like a heart. Then it speaks in an old woman\'s voice: <i>"Granddaughter. Carry me north, to where they will build the first bell."</i>'],['Chapter II Complete','<b>Score: '+r.sc+'</b>  \u00b7  Best: '+S.best+'\nKills: '+G.kills+'\nAsh: <span class="ash">+'+r.ashGain+'</span>\n\nChapter III: <b>The First Bell</b> is coming.']],()=>{refreshMenu();show('menu');state='menu';}),1400);}
function startCh2(){newRun();G.stage=4;G.heroes.forEach(q=>{q.max=Math.round(q.max*1.25);q.hp=q.max});cards([CH2CARD],showMap);}

function refreshMenu(){$('mStats').innerHTML='Best: '+S.best+' · Ash: <span class="ash">'+S.ash+'</span>'+(S.ng?' · Ember Toll '+S.ng:'');}
function startRun(){newRun();cards(S.wins?[INTRO[2]]:INTRO,showMap);}
$('mPlay').onclick=()=>{audio();SFX.ui();startRun();};
$('mCh2').onclick=()=>{audio();SFX.ui();startCh2();};
$('mShop').onclick=()=>{audio();SFX.ui();openShop('menu');};
$('mLore').onclick=()=>{audio();SFX.ui();cards([['Folk Tales of the Steppe',LORE]],()=>{show('menu');state='menu';});};
let shopBack='menu';
function openShop(b){shopBack=b;show('shop');renderShop();}
function renderShop(){$('shAsh').innerHTML='<span class="ash">'+S.ash+' Ash</span>';$('shList').innerHTML='';
 UPG.forEach(u=>{const lv=S.up[u.k],mx=lv>=u.max,c=cost(u),d=document.createElement('div');d.className='upg';
  d.innerHTML='<div class="t">'+u.n+' <span style="color:var(--gold)">'+'◆'.repeat(lv)+'<span style="opacity:.3">'+'◆'.repeat(u.max-lv)+'</span></span><small>'+u.d+'</small></div>';
  const b=document.createElement('button');b.className='btn'+(mx?'':' gold');b.textContent=mx?'MAX':c+' Ash';b.disabled=mx||S.ash<c;
  b.onclick=()=>{if(S.ash<c)return;S.ash-=c;S.up[u.k]++;save();SFX.heal();buzz(20);renderShop();};d.appendChild(b);$('shList').appendChild(d);});}
$('shBack').onclick=()=>{SFX.ui();if(shopBack==='over')show('over');else{refreshMenu();show('menu');}};
$('oA').onclick=()=>{SFX.ui();startRun();};
$('oS').onclick=()=>{SFX.ui();openShop('over');};
$('oM').onclick=()=>{SFX.ui();refreshMenu();show('menu');state='menu';};
$('pause').addEventListener('pointerdown',e=>{e.stopPropagation();if(state!=='play')return;state='paused';show('paused');});
$('pR').onclick=()=>{show(null);$('hud').classList.add('on');state='play';last=performance.now();};
$('pSnd').onclick=()=>{S.snd=S.snd?0:1;save();if(master)master.gain.value=S.snd?.5:0;$('pSnd').textContent='Sound: '+(S.snd?'On':'Off');};
$('pQ').onclick=()=>{state='play';gameOver();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='paused';show('paused');}});
function hud(){$('top').innerHTML=G.heroes.map((q,i)=>'<div class="hc'+(i===G.act?' act':'')+(q.dead?' dead':'')+'">'+q.d.ico+' '+q.d.n+'<div class="bar"><b style="width:'+(q.hp/q.max*100)+'%"></b></div></div>').join('');
 const h=hero();$('skn').textContent=h.d.skn;$('skcd').style.height=(h.sk/h.d.skCd*100)+'%';$('swcd').style.height=(G.swapCd/3*100)+'%';}

/* ---------- RENDER ---------- */
function glowCircle(x,y,r,c,b){cx.shadowColor=c;cx.shadowBlur=b||0;cx.fillStyle=c;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();cx.shadowBlur=0;}
function drawHero(t){const h=hero(),c=h.d.col,x=G.x,y=G.y,bob=Math.sin(t*8)*1.5;
 cx.fillStyle='rgba(0,0,0,.4)';cx.beginPath();cx.ellipse(x,y+16,14,5,0,0,7);cx.fill();
 if(G.block>0){cx.strokeStyle='rgba(158,224,255,'+(.5+.3*Math.sin(t*20))+')';cx.lineWidth=4;cx.beginPath();cx.arc(x,y,26,0,7);cx.stroke();}
 if(G.inv>0&&Math.floor(t*20)%2)cx.globalAlpha=.5;
 cx.shadowColor=h.d.glow;cx.shadowBlur=18;cx.fillStyle=c;cx.beginPath();cx.moveTo(x,y-18+bob);cx.lineTo(x+13,y+14);cx.lineTo(x-13,y+14);cx.closePath();cx.fill();
 cx.fillStyle='#f3e0c8';cx.beginPath();cx.arc(x,y-14+bob,7,0,7);cx.fill();cx.shadowBlur=0;
 const a=Math.atan2(G.fy,G.fx),L=h.d.id==='ta'?34:20;cx.strokeStyle=h.d.glow;cx.lineWidth=3;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L);cx.stroke();
 if(h.d.id==='ys')glowCircle(x+Math.cos(a)*20,y+Math.sin(a)*20,4,'#ffb060',14);
 cx.globalAlpha=1;
 if(G.swapBonus>0){cx.strokeStyle='#ffe08a';cx.lineWidth=2;cx.beginPath();cx.arc(x,y,30+Math.sin(t*12)*3,0,7);cx.stroke();}
}
function drawEnemy(e,t){const x=e.x,y=e.y,r=e.r,w=Math.sin(e.ph*6)*2;
 cx.fillStyle='rgba(0,0,0,.4)';cx.beginPath();cx.ellipse(x,y+r*.9,r,r*.35,0,0,7);cx.fill();
 cx.shadowColor=e.boss?'#ff3a1a':e.ranged?'#b08aff':'#ff5a2a';cx.shadowBlur=e.boss?30:10;cx.fillStyle=e.hit>0?'#fff':e.col;
 if(e.boss){cx.beginPath();for(let i=0;i<14;i++){const a=i/14*6.283,rr=r*(1+.12*Math.sin(t*3+i*1.7));cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();cx.fill();
  for(let i=0;i<5;i++){const a=t*.8+i*1.256;glowCircle(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.4-6,4,'#ffcc66',16);}
  glowCircle(x,y+4,10+Math.sin(t*6)*2,'#ff5a1a',30);}
 else if(e.type==='hound'){cx.beginPath();cx.ellipse(x,y,r*1.3,r*.7,Math.atan2(G.y-y,G.x-x),0,7);cx.fill();}
 else if(e.type==='wisp'){cx.globalAlpha=.75;cx.beginPath();cx.arc(x,y+w,r,0,7);cx.fill();cx.globalAlpha=1;}
 else{cx.beginPath();cx.moveTo(x-r*.8,y+r);cx.lineTo(x-r*.6,y-r*.4+w);cx.arc(x,y-r*.5+w,r*.6,3.14,0);cx.lineTo(x+r*.8,y+r);cx.closePath();cx.fill();
  if(e.armor){cx.strokeStyle='#9ee0ff88';cx.lineWidth=2;cx.stroke();}}
 cx.shadowBlur=0;
 if(!e.boss){glowCircle(x-r*.22,y-r*.5+w,2.2,'#ffb060',8);glowCircle(x+r*.22,y-r*.5+w,2.2,'#ffb060',8);}
 if(e.hp<e.max&&!e.boss){cx.fillStyle='#0009';cx.fillRect(x-r,y-r-12,r*2,4);cx.fillStyle='#ff5a3a';cx.fillRect(x-r,y-r-12,r*2*e.hp/e.max,4);}
}

function render(){
 cx.setTransform(DPR,0,0,DPR,0,0);
 const s=G?STAGES[Math.min(G.stage,STAGES.length-1)]:STAGES[3],t=performance.now()/1000;
 const bg=cx.createLinearGradient(0,0,0,H);bg.addColorStop(0,s.col[0]);bg.addColorStop(1,s.col[1]);cx.fillStyle=bg;cx.fillRect(0,0,W,H);
 const inGame=G&&(state==='play'||state==='between'||state==='over'||state==='paused');
 if(inGame){
  const zoom=Math.max(.62,Math.min(1,Math.min(W,H)/620));
  G.camx+=(G.x-W/2/zoom-G.camx)*.15;G.camy+=(G.y-H/2/zoom-G.camy)*.15;
  const sx=shake>0?rnd(-shake,shake):0,sy=shake>0?rnd(-shake,shake):0;
  cx.save();cx.scale(zoom,zoom);cx.translate(-G.camx+sx,-G.camy+sy);
  const ag=cx.createRadialGradient(AW/2,AH/2,50,AW/2,AH/2,AW*.75);ag.addColorStop(0,s.gr);ag.addColorStop(1,s.col[1]);cx.fillStyle=ag;cx.fillRect(0,0,AW,AH);
  cx.strokeStyle='rgba(232,194,122,.07)';cx.lineWidth=1;for(let i=0;i<=AW;i+=110){cx.beginPath();cx.moveTo(i,0);cx.lineTo(i,AH);cx.moveTo(0,i);cx.lineTo(AW,i);cx.stroke();}
  cx.strokeStyle='#e8c27a55';cx.lineWidth=4;cx.shadowColor='#ff7a2f';cx.shadowBlur=20;cx.strokeRect(0,0,AW,AH);cx.shadowBlur=0;
  for(let i=0;i<14;i++){cx.fillStyle='rgba(220,200,180,.08)';cx.beginPath();cx.ellipse((i*337)%AW,(i*521)%AH,22,8,i,0,7);cx.fill();}
  for(const f of FX){const k=1-f.l/f.ml;
   if(f.k==='ring'){cx.strokeStyle=f.c;cx.globalAlpha=1-k;cx.lineWidth=6*(1-k)+1;cx.beginPath();cx.arc(f.x,f.y,f.r*(.3+.7*k),0,7);cx.stroke();}
   else if(f.k==='arc'){cx.strokeStyle=f.c;cx.globalAlpha=1-k;cx.lineWidth=10;cx.beginPath();cx.arc(f.x,f.y,f.r*.8,f.a-.9,f.a+.9);cx.stroke();}
   else if(f.k==='tel'){cx.fillStyle='rgba(255,40,20,'+(.12+.25*k)+')';cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill();cx.strokeStyle='#ff3a1a';cx.lineWidth=3;cx.beginPath();cx.arc(f.x,f.y,f.r*k,0,7);cx.stroke();}
   cx.globalAlpha=1;}
  for(const a of ASHP)glowCircle(a.x,a.y,3.5,'#ff9a3a',10);
  for(const e of ENS)drawEnemy(e,t);
  if(G.spirit){cx.globalAlpha=.8;glowCircle(G.spirit.x,G.spirit.y+Math.sin(t*5)*4,10,'#e0d0ff',24);cx.globalAlpha=1;}
  drawHero(t);
  for(const p of PR)glowCircle(p.x,p.y,p.r,p.c,16);
  cx.globalCompositeOperation='lighter';
  for(const p of P){cx.globalAlpha=Math.max(0,p.l/p.ml);cx.fillStyle=p.c;cx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';cx.textAlign='center';
  for(const x of TXT){const k=x.l/x.ml;cx.globalAlpha=Math.min(1,k*2);cx.font=(x.big?'bold 26px':'bold 17px')+' Georgia';cx.lineWidth=4;cx.strokeStyle='#000';const sc=x.big?1+Math.max(0,k-.8)*2:1;cx.save();cx.translate(x.x,x.y-(1-k)*40);cx.scale(sc,sc);cx.strokeText(x.s,0,0);cx.fillStyle=x.c;cx.fillText(x.s,0,0);cx.restore();}
  cx.globalAlpha=1;cx.textAlign='left';cx.restore();
  if(joy.id!==null){cx.strokeStyle='rgba(232,194,122,.4)';cx.lineWidth=3;cx.beginPath();cx.arc(joy.ox,joy.oy,60,0,7);cx.stroke();glowCircle(joy.x,joy.y,24,'rgba(255,122,47,.6)',20);}
  else if(state==='play'&&G.t<6&&G.stage===0){cx.fillStyle='rgba(243,233,220,.6)';cx.font='16px Georgia';cx.textAlign='center';cx.fillText('Drag left side to move',W*.27,H*.8);cx.textAlign='left';}
  if(G.boss&&!G.boss.dead){const bw=Math.min(W-40,460),bx=(W-bw)/2,by=H-200;cx.fillStyle='#000a';cx.fillRect(bx,by,bw,14);const gg=cx.createLinearGradient(bx,0,bx+bw,0);gg.addColorStop(0,'#c2263a');gg.addColorStop(1,'#ff7a2f');cx.fillStyle=gg;cx.fillRect(bx,by,bw*G.boss.hp/G.boss.max,14);cx.strokeStyle='#e8c27a';cx.strokeRect(bx,by,bw,14);cx.fillStyle='#e8c27a';cx.font='bold 14px Georgia';cx.textAlign='center';cx.fillText('THE HOLLOW KING',W/2,by-6);cx.textAlign='left';}
  const lh=hero().hp/hero().max;if(lh<.3){const v=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);v.addColorStop(0,'rgba(194,38,58,0)');v.addColorStop(1,'rgba(194,38,58,'+(.35+.15*Math.sin(t*6))+')');cx.fillStyle=v;cx.fillRect(0,0,W,H);}
 }
 for(const e of BGE){const y=((e.y*H-t*e.v)%H+H)%H,x=e.x*W+Math.sin(t+e.p)*12;cx.fillStyle='rgba(255,140,60,'+(.2+.2*Math.sin(t*2+e.p))+')';cx.beginPath();cx.arc(x,y,e.s,0,7);cx.fill();}
 if(flash>0){cx.fillStyle='rgba(255,230,200,'+flash*.5+')';cx.fillRect(0,0,W,H);}
}
function loop(now){
 let dt=Math.min(.05,(now-last)/1000||0);last=now;
 if(slowmo>0){slowmo-=dt;dt*=.3;}
 if(G&&state==='play'){update(dt);hud();}
 for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.l-=dt;}filt(P,p=>p.l>0);
 for(const f of FX)f.l-=dt;filt(FX,f=>f.l>0);
 for(const x of TXT)x.l-=dt;filt(TXT,x=>x.l>0);
 shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt*2.5);
 render();requestAnimationFrame(loop);
}
refreshMenu();requestAnimationFrame(loop);
</script>
</body></html>
